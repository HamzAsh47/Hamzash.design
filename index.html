    <!--
      Absolute, because a crawler resolves these against nothing. Update the
      origin here and in VITE_SITE_URL together if a custom domain is attached.

      These static tags are what a link unfurler actually reads: Facebook,
      LinkedIn and Slack do not run the page's JavaScript, and a hash fragment
      is never sent to the server. So a shared case-study link previews as the
      site rather than as that study — the cost of hash routing with no server,
      and the reason the copy here describes the whole practice.
    -->
