<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Email signature — internal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Black&family=Fraunces:ital,wght@1,400&family=JetBrains+Mono:wght@500;700&display=swap');
</style>
</head>
<body style="margin:0; padding:40px 20px; background:#eef0f3;">

<div style="max-width:700px; margin:0 auto 14px auto; font-family:Arial, sans-serif; font-size:12px; letter-spacing:1px; color:#4A4E58; text-transform:uppercase;">
  Gmail-safe signature — hosted images, tiny HTML (~3KB instead of 277KB)
</div>

<!-- ============ COPY EVERYTHING FROM HERE ============ -->
<!-- The seven images are already hosted at hamzash47.com/assets/signature/ and the
     src URLs below point at them, so there is nothing to upload or replace: select
     the block below, copy, and paste it into Gmail's signature box.

     The images stay linked rather than embedded on purpose. Base64 data inside the
     signature is what produced Gmail's "signature too long" error, and it is also
     what makes a signature balloon a short reply into a quarter of a megabyte. -->
<table role="presentation" width="100%" style="max-width:700px;" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="background-color:#0D1526;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td colspan="3" height="24" style="line-height:1px; font-size:1px;">&nbsp;</td>
        </tr>
        <tr>

          <!-- LEFT 8%: vertical text -->
          <td width="8%" valign="middle" align="center">
            <img src="https://hamzash47.com/assets/signature/vertical-text.png" width="14" height="227" alt="Senior Art Director" style="display:block; border:0; outline:none; text-decoration:none; max-width:14px; height:auto;" />
          </td>

          <!-- MIDDLE 52%: text -->
          <td width="52%" valign="top" style="padding:0 14px;">

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr><td style="padding-bottom:6px;">
                <img src="https://hamzash47.com/assets/signature/logo.png" width="26" height="28" alt="Hamza Ashraf" style="display:block; border:0; outline:none; text-decoration:none;" />
              </td></tr>

              <!-- HAMZA = Archivo Black, ASHRAF = Archivo Regular -->
              <tr><td style="line-height:1.02; padding-bottom:4px;">
                <span style="font-family:'Archivo Black', Arial, sans-serif; font-weight:900; font-size:32px; color:#F1F2F2;">HAMZA</span>
                <span style="font-family:'Archivo', Arial, sans-serif; font-weight:400; font-size:32px; color:#C81E3A;"> ASHRAF</span>
              </td></tr>

              <tr><td style="font-family:'Fraunces', 'Times New Roman', serif; font-style:italic; font-size:15px; color:#B9BCC4;">
                Senior Art Director &middot; UI/UX &amp; Product Strategist &middot; Motion &amp; Brand
              </td></tr>

              <!-- divider: 2px high, 40px wide, 15px padding above/below -->
              <tr><td style="padding:15px 0;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
                  <td width="40" height="2" bgcolor="#C81E3A" style="font-size:1px; line-height:1px;">&nbsp;</td>
                </tr></table>
              </td></tr>

              <!-- contact block -->
              <tr><td style="font-family:'JetBrains Mono', Courier, monospace; font-size:13px; color:#F1F2F2; line-height:1.55;">
                <a href="mailto:contact@hamzash47.com" style="color:#F1F2F2; text-decoration:none;">contact@hamzash47.com</a><br/>
                <a href="https://hamzash47.com" style="color:#F1F2F2; text-decoration:none;">hamzash47.com</a>
              </td></tr>

              <!-- icon row: YouTube, LinkedIn, Instagram, WhatsApp — all clickable -->
              <tr><td style="padding-top:14px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
                  <td style="padding-right:5px;"><a href="https://youtube.com/@hamzash.47"><img src="https://hamzash47.com/assets/signature/icon-youtube.png" width="24" height="24" alt="YouTube" style="display:block; border:0; outline:none; text-decoration:none;"/></a></td>
                  <td style="padding-right:5px;"><a href="https://linkedin.com/in/hamzash47"><img src="https://hamzash47.com/assets/signature/icon-linkedin.png" width="24" height="24" alt="LinkedIn" style="display:block; border:0; outline:none; text-decoration:none;"/></a></td>
                  <td style="padding-right:5px;"><a href="https://instagram.com/hamzash.47"><img src="https://hamzash47.com/assets/signature/icon-instagram.png" width="24" height="24" alt="Instagram" style="display:block; border:0; outline:none; text-decoration:none;"/></a></td>
                  <td><a href="https://wa.me/923183749996"><img src="https://hamzash47.com/assets/signature/icon-whatsapp.png" width="24" height="24" alt="WhatsApp" style="display:block; border:0; outline:none; text-decoration:none;"/></a></td>
                </tr></table>
              </td></tr>

              <tr><td style="font-family:'JetBrains Mono', Courier, monospace; font-style:italic; font-size:12.5px; color:#4A4E58; padding-top:14px;">
                Let's build.
              </td></tr>
            </table>

          </td>

          <!-- RIGHT 40%: larger portrait, with right padding -->
          <td width="40%" valign="middle" align="right" style="padding-right:22px;">
            <img src="https://hamzash47.com/assets/signature/portrait.jpg" width="100%" style="display:block; border:0; outline:none; text-decoration:none; max-width:230px; height:auto; width:100%;" alt="Hamza Ashraf" />
          </td>

        </tr>
        <tr>
          <td colspan="3" height="24" style="line-height:1px; font-size:1px;">&nbsp;</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<!-- ============ COPY EVERYTHING TO HERE ============ -->

</body>
</html>
